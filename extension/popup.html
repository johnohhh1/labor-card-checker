<!doctype html><html><head><meta charset="utf-8"><style>body{font:15px Arial;width:310px;padding:18px;color:#182b45}button{padding:10px;background:#074ab9;color:white;border:0;border-radius:6px;width:100%;margin-top:16px}input[type=date]{padding:8px;width:90%}p{line-height:1.4}#status{white-space:pre-wrap}fieldset{margin-top:16px;border:1px solid #ccd4df;border-radius:6px;padding:12px}.days{display:grid;grid-template-columns:1fr 1fr;gap:12px}label{display:flex;align-items:center;gap:7px}.all{background:#eef2f7;color:#182b45;margin:10px 0 0}button:disabled{opacity:.5}small{display:block;color:#536276;margin-top:10px}</style></head><body><h2>Weekly Labor Cards</h2><p>Sign in to HotSchedules first. Choose the Thursday for your week.</p><input id="start" aria-label="Week starting Thursday" type="date"><fieldset><legend>Days to download</legend><div class="days"><label><input type="checkbox" value="0" checked>Thursday</label><label><input type="checkbox" value="1" checked>Friday</label><label><input type="checkbox" value="2" checked>Saturday</label><label><input type="checkbox" value="3" checked>Sunday</label><label><input type="checkbox" value="4" checked>Monday</label><label><input type="checkbox" value="5" checked>Tuesday</label><label><input type="checkbox" value="6" checked>Wednesday</label></div><button id="all" class="all" type="button">Select full week</button><button id="varsity" class="all" type="button" title="Select Friday, Saturday, and Sunday">Varsity · Fri / Sat / Sun</button><small>All seven days are selected by default. Uncheck any days you don’t need.</small></fieldset><button id="run">Download seven PDFs</button><p id="status" role="status" aria-live="polite"></p><script src="popup.js"></script></body></html>
